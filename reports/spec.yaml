# Query workload for the lab, one spec for every variant.
#
# reports/generate.py turns this into, per variant:
#   models/<variant>/<variant>-workload.Report/   PBIR report bound to the variant's model
#   reports/queries/<variant>.json                DAX per visual, the way the report asks for it
#
# Pages take the first N visuals of the pool, so a larger page contains every smaller one.
# Fields are written as Table[Column] or Table[Measure]; the generator looks up which is which
# in the variant's TMDL and stops if a field is missing.
#
# Visual types and the roles they use:
#   card                 values: one measure
#   clusteredColumnChart category: columns, values: measures
#   clusteredBarChart    category: columns, values: measures
#   lineChart            category: columns, values: measures
#   tableEx              values: columns and measures (with a total row)
#   pivotTable           rows: columns, columns: columns, values: measures (with totals)
#   slicer               values: one column; selected: the values selected when the page opens
#
# Slicers filter every other visual on their page, as Desktop does by default. A visual on a page
# with slicers may not be on another page, because its DAX includes the page's filters.

version: 1

page:
  width: 1280
  height: 720

pages:
  - name: p01
    title: 1 visual
    visuals: 1
  - name: p05
    title: 5 visuals
    visuals: 5
  - name: p10
    title: 10 visuals
    visuals: 10
  - name: p20
    title: 20 visuals
    visuals: 20
  - name: pf
    title: Filtered
    visuals: [s01, s02, f01, f02, f03, f04, f05, f06]

visuals:
  - id: v01
    type: pivotTable
    title: Sales by brand and year
    rows: ["Product[Brand]"]
    columns: ["Date[Year]"]
    values: ["Sales[Sales Amount]"]
  - id: v02
    type: card
    title: Sales amount
    values: ["Sales[Sales Amount]"]
  - id: v03
    type: clusteredColumnChart
    title: Sales by year
    category: ["Date[Year]"]
    values: ["Sales[Sales Amount]"]
  - id: v04
    type: clusteredBarChart
    title: Sales by category
    category: ["Product[Category]"]
    values: ["Sales[Sales Amount]"]
  - id: v05
    type: tableEx
    title: Customers by country
    values: ["Customer[Country]", "Sales[Sales Amount]", "Sales[Margin]", "Sales[# Orders]"]
  - id: v06
    type: lineChart
    title: Sales by month
    category: ["Date[Year Month]"]
    values: ["Sales[Sales Amount]"]
  - id: v07
    type: card
    title: Orders
    values: ["Sales[# Orders]"]
  - id: v08
    type: card
    title: Margin %
    values: ["Sales[Margin %]"]
  - id: v09
    type: clusteredBarChart
    title: Quantity by store country
    category: ["Store[Country]"]
    values: ["Sales[Total Quantity]"]
  - id: v10
    type: clusteredColumnChart
    title: Margin by continent
    category: ["Customer[Continent]"]
    values: ["Sales[Margin]"]
  - id: v11
    type: card
    title: Total cost
    values: ["Sales[Total Cost]"]
  - id: v12
    type: lineChart
    title: Margin % by quarter
    category: ["Date[Year Quarter]"]
    values: ["Sales[Margin %]"]
  - id: v13
    type: tableEx
    title: Subcategories
    values: ["Product[Subcategory]", "Sales[Sales Amount]", "Sales[Total Quantity]"]
  - id: v14
    type: clusteredBarChart
    title: Orders by gender
    category: ["Customer[Gender]"]
    values: ["Sales[# Orders]"]
  - id: v15
    type: pivotTable
    title: Continent and country
    rows: ["Customer[Continent]", "Customer[Country]"]
    values: ["Sales[Sales Amount]", "Sales[Margin %]"]
  - id: v16
    type: clusteredColumnChart
    title: Sales by weekday
    category: ["Date[Day of Week]"]
    values: ["Sales[Sales Amount]"]
  - id: v17
    type: card
    title: Quantity
    values: ["Sales[Total Quantity]"]
  - id: v18
    type: tableEx
    title: Stores
    values: ["Store[Name]", "Sales[Sales Amount]", "Sales[# Orders]"]
  - id: v19
    type: clusteredBarChart
    title: Margin by manufacturer
    category: ["Product[Manufacturer]"]
    values: ["Sales[Margin]"]
  - id: v20
    type: pivotTable
    title: Orders by category and continent
    rows: ["Product[Category]"]
    columns: ["Customer[Continent]"]
    values: ["Sales[# Orders]"]

  # Page pf: two slicers and the visuals they filter. On 1M data, Computers has 545,359 of the
  # 2,349,091 Sales rows and Germany 266,485, with 5,000 cities. Used by v24-bidirectional and
  # v25-many-to-many, where the filters have to cross Sales to reach the other dimensions.
  - id: s01
    type: slicer
    title: Category
    values: ["Product[Category]"]
    selected: ["Computers"]
  - id: s02
    type: slicer
    title: Country
    values: ["Customer[Country]"]
    selected: ["Germany"]
  - id: f01
    type: card
    title: Sales amount
    values: ["Sales[Sales Amount]"]
  - id: f02
    type: clusteredColumnChart
    title: Sales by year
    category: ["Date[Year]"]
    values: ["Sales[Sales Amount]"]
  - id: f03
    type: clusteredBarChart
    title: Sales by brand
    category: ["Product[Brand]"]
    values: ["Sales[Sales Amount]"]
  - id: f04
    type: tableEx
    title: Cities
    values: ["Customer[City]", "Sales[Sales Amount]", "Sales[# Orders]"]
  - id: f05
    type: tableEx
    title: Stores
    values: ["Store[Name]", "Sales[Sales Amount]"]
  - id: f06
    type: pivotTable
    title: Subcategories by year
    rows: ["Product[Subcategory]"]
    columns: ["Date[Year]"]
    values: ["Sales[Sales Amount]", "Sales[Margin %]"]

# Per-variant additions. A variant gets the pages above plus its own; its visuals join the pool.
# A page lists visual ids instead of a count when it is not "the first N of the pool".
variants:
  v27-high-cardinality-visuals:
    visuals:
      - id: h01
        type: tableEx
        title: Orders
        values: ["Sales[Order Number]", "Sales[Sales Amount]", "Sales[Total Quantity]"]
      - id: h02
        type: tableEx
        title: Customers
        values: ["Customer[Name]", "Customer[City]", "Sales[Sales Amount]", "Sales[# Orders]"]
      - id: h03
        type: tableEx
        title: Order lines
        values: ["Sales[Order Number]", "Sales[Line Number]", "Product[Product Name]", "Sales[Sales Amount]"]
      - id: h04
        type: pivotTable
        title: Customers by year
        rows: ["Customer[Name]"]
        columns: ["Date[Year]"]
        values: ["Sales[Sales Amount]"]
      - id: h05
        type: clusteredBarChart
        title: Sales by product
        category: ["Product[Product Name]"]
        values: ["Sales[Sales Amount]"]
    pages:
      - name: p27
        title: High cardinality
        visuals: [h01, h02, h03, h04, h05]
